spring.application.name=sb-constructions
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sb_constructions?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-chars}
app.jwt.expiration-ms=86400000

app.upload-dir=${UPLOAD_DIR:uploads}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

